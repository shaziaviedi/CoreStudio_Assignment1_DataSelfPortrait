<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self as System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app">
        <header>
            <h1>2,383 VERSIONS OF ME</h1>
            <p>Self as System</p>
        </header>

        <div id="current-time-display">
            <p>CURRENT TIME</p>
            <time id="current-time">00:00</time>
        </div>

        <section id="portrait-container" aria-label="Portrait">
            <!-- load portrait SVG through script.js -->
        </section>

        <aside id="info">
            <p>Structured</p>
            <p>2023-2026</p>
            <p>2,383 scheduled tasks</p>
        </aside>

        <aside id="task-panel" hidden>
            <h2 id="task-title"></h2>
            <p id="task-date"></p>
            <p id="task-time"></p>
            <p id="task-duration"></p>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
